# GPU优化配置 - RTX 5070
experiment:
  name: "eeg2text_chinese_gpu"
  seed: 42
  device: "cuda"
  mixed_precision: true  # 启用混合精度训练

# 数据配置 - 增大batch size以充分利用GPU
data:
  root_dir: "F:/ChineseEEG"
  subjects: ["sub-04", "sub-05", "sub-06", "sub-07", "sub-08",
             "sub-09", "sub-10", "sub-13", "sub-14", "sub-15"]
  exclude_subjects: ["sub-11", "sub-12"]
  val_subject: "sub-15"        # 留一被试验证，该被试全部数据作为验证集
  sampling_rate: 256
  n_channels: 128
  char_duration: 350
  time_window: [0, 350]
  novels: ["ses-GarnettDream"]
  granularity: "row"           # 对比学习用行级（有BERT嵌入，对齐质量更高）
  granularity_generation: "paragraph"  # 生成阶段用段落级（更长文本，更丰富语义）
  max_row_samples: 1024        # 根据sub-04/sub-05标准，应该是1024
  paragraph_n_rows: 3          # 每个段落包含3行（约30个字符）
  paragraph_cache_dir: "E:/eeg_cache_para"
  row_cache_dir: "E:/eeg_cache_row"
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  data_ratio: 1.0   # 使用全部数据
  batch_size: 64        # 实际 batch，显存友好
  gradient_accumulation_steps: 4  # 等效 batch_size=256
  num_workers: 0
  shuffle: true
  pin_memory: false
  prefetch_factor: 2
  augment: true              # 训练时开启EEG数据增强
  cache_dir: "E:/eeg_cache"

# 模型配置 - 使用完整模型
model:
  eeg_encoder:
    n_channels: 128
    n_times: 3072              # 段落级：paragraph_n_rows(3) × max_row_samples(1024)
    embedding_dim: 256
    temporal_kernel: 25
    n_filters: 20
    dropout: 0.6
    use_spatial_attention: true
    use_graph_attention: false  # 论文报告的模型不含图注意力（无电极坐标/图先验）；复现论文结果必须保持 false。仅保留开关用于消融。

  contrastive:
    embedding_dim: 256
    temperature: 0.07
    curriculum_start: 0.3
    curriculum_end: 1.0
    n_curriculum_epochs: 20
    projection_dim: 128

  decoder:
    type: "bart"
    bart_model: "fnlp/bart-base-chinese"
    hidden_dim: 256
    vocab_size: 50000
    n_layers: 2
    dropout: 0.1
    n_eeg_tokens: 16     # 增加到16个token，给解码器更多EEG条件信息

# 训练配置
training:
  contrastive_epochs: 15
  contrastive_lr: 0.00002  # 行级数据量少，降低学习率避免震荡
  contrastive_weight_decay: 0.01

  generation_epochs: 20
  generation_lr: 0.0004  # batch_size 64→256，线性缩放
  generation_weight_decay: 0.01

  gradient_clip: 1.0
  scheduler: "cosine"
  warmup_epochs: 3

  # GPU优化
  amp: true   # 开启AMP加速BART计算
  gradient_accumulation_steps: 2  # 梯度累积，模拟更大batch